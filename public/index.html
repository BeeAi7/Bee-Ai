<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bee AI</title>
<style>
:root{--bg:#08090b;--panel:#101216;--panel2:#15171c;--line:#282b31;--text:#f5f5f5;--muted:#9298a3;--yellow:#ffd21c;--yellow2:#f0b900}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:270px;background:rgba(15,17,21,.96);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;padding:8px}.bee{font-size:30px;animation:float 3.2s ease-in-out infinite}.logo span,.yellow{color:var(--yellow)}
.new{border:0;background:var(--yellow);color:#111;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}
.section{font-size:12px;color:var(--muted);padding:8px}.chats{overflow:auto;flex:1}.chat{padding:11px;border-radius:10px;color:#dfe2e8;cursor:pointer;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat.active,.chat:hover{background:#1b1e24}
.bottom{border-top:1px solid var(--line);padding-top:12px}.profile{display:flex;gap:10px;align-items:center;padding:8px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--yellow);color:#111;display:grid;place-items:center;font-weight:800}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(10,11,14,.88);backdrop-filter:blur(5px)}
.brand{font-weight:800;font-size:21px}.actions{display:flex;gap:8px}.icon,.tool{border:1px solid var(--line);background:#14161a;color:#ddd;border-radius:10px;padding:8px 10px;cursor:pointer}
.content{flex:1;overflow:auto;padding:35px 18px}.welcome{text-align:center;margin:15px auto 30px}.bigbee{font-size:64px;animation:float 3.2s ease-in-out infinite}.welcome h1{font-size:38px;margin:10px 0 6px}.welcome p{color:var(--muted)}
.messages{width:min(900px,100%);margin:0 auto}.message{display:flex;gap:10px;margin:18px 0;animation:in .18s ease-out}.message.user{justify-content:flex-end}.bubble{max-width:78%;padding:13px 16px;border-radius:16px;background:var(--panel2);border:1px solid #252830;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--yellow);color:#111;border-color:var(--yellow)}
.mini{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--yellow);display:grid;place-items:center}.typing{opacity:.8}.dots span{display:inline-block;animation:dot 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.suggestions,.tools{width:min(900px,100%);margin:20px auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{border:1px solid var(--line);background:#111318;color:#ddd;border-radius:12px;padding:10px 12px;cursor:pointer}.chip:hover{border-color:var(--yellow)}
.composer-wrap{width:min(900px,100%);margin:18px auto 0}.composer{display:flex;gap:8px;align-items:center;background:rgba(17,19,23,.9);border:1px solid #30343c;border-radius:17px;padding:8px;backdrop-filter:blur(5px)}#input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:11px;font-size:15px}.send{width:43px;height:43px;border:0;border-radius:50%;background:var(--yellow);color:#111;font-weight:900;cursor:pointer}.disclaimer{text-align:center;color:#6f7480;font-size:11px;margin-top:8px}
pre{background:#090a0c;border:1px solid #292c33;border-radius:10px;padding:12px;overflow:auto;white-space:pre}.codehead{display:flex;justify-content:space-between;color:#aaa;font-size:11px;margin-bottom:6px}.copy{border:1px solid #444;background:#17191d;color:#fff;border-radius:7px;padding:4px 8px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:min(440px,100%);background:#111318;border:1px solid #30343c;border-radius:18px;padding:18px;box-shadow:0 12px 50px #000}.box h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.close{border:1px solid var(--line);background:#191b20;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(3,80px);gap:7px;justify-content:center;margin:18px 0}.cell{width:80px;height:80px;border:1px solid #383c45;background:#171a20;color:var(--yellow);font-size:30px;border-radius:10px;cursor:pointer}
@keyframes float{50%{transform:translateY(-4px)}}@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes dot{50%{opacity:.25}}
@media(max-width:760px){.sidebar{display:none}.welcome h1{font-size:30px}.bubble{max-width:88%}.content{padding:25px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo"><div class="bee">🐝</div><div>Bee <span>AI</span></div></div>
  <button class="new" onclick="newChat()">＋ New Chat</button>
  <div class="section">Recent chats</div>
  <div class="chats" id="chatList"></div>
  <div class="bottom"><div class="profile"><div class="avatar">B</div><div><b>Bee AI</b><br><small style="color:#888">Free Plan</small></div></div></div>
</aside>
<main class="main">
<header class="topbar"><button class="icon" onclick="toggleSidebar()">☰</button><div class="brand">🐝 Bee <span>AI</span></div><div class="actions"><button class="icon" onclick="toggleTheme()">☀</button><button class="icon" onclick="openGame()">🎮</button></div></header>
<section class="content" id="content">
<div class="welcome" id="welcome"><div class="bigbee">🐝</div><h1>Hello, <span class="yellow">Bee AI!</span></h1><p>Your fast, friendly AI assistant.</p></div>
<div class="messages" id="messages"></div>
<div class="suggestions" id="suggestions">
<button class="chip" onclick="ask('Explain AI in simple words')">Explain AI simply</button>
<button class="chip" onclick="ask('Give me some study ideas')">Study ideas</button>
<button class="chip" onclick="ask('Help me build a website')">Build a website</button>
<button class="chip" onclick="ask('Give me creative ideas')">Creative ideas</button>
</div>
<div class="tools"><button class="chip" onclick="openGame()">🎮 Mini Game</button><button class="chip" onclick="quickIdeas()">⚡ Quick Ideas</button><button class="chip" onclick="copyChat()">📋 Copy Chat</button><button class="chip" onclick="exportChat()">⬇️ Export</button></div>
<div class="composer-wrap"><div class="composer"><button class="tool" onclick="document.getElementById('file').click()">📎</button><input id="input" placeholder="Message Bee AI..." autocomplete="off"><input id="file" type="file" hidden><button class="tool" onclick="alert('Voice input can be connected later.')">🎤</button><button class="send" onclick="send()">➤</button></div><div class="disclaimer">Bee AI can make mistakes. Check important information.</div></div>
</section>
</main></div>

<div class="modal" id="gameModal"><div class="box"><h2>🐝 Bee Tic-Tac-Toe</h2><p id="gameStatus">Your turn — you are X.</p><div class="board" id="board"></div><div class="modal-actions"><button class="close" onclick="resetGame()">Restart</button><button class="close" onclick="closeGame()">Close</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY="bee_ai_full_v51";
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{chats:[],current:null,theme:"dark"};
let saving=null;

function save(){clearTimeout(saving);saving=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(state)),300)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function currentChat(){return state.chats.find(c=>c.id===state.current)}
function renderChats(){
  const box=$("chatList"); const frag=document.createDocumentFragment();
  state.chats.slice().reverse().slice(0,40).forEach(c=>{const d=document.createElement("div");d.className="chat"+(c.id===state.current?" active":"");d.textContent=c.title||"New Chat";d.onclick=()=>loadChat(c.id);frag.appendChild(d)});box.replaceChildren(frag)
}
function renderMessages(){
  const chat=currentChat(); const box=$("messages"); box.replaceChildren();
  if(!chat){$("welcome").style.display="block";return}
  $("welcome").style.display=chat.messages.length?"none":"block";
  const frag=document.createDocumentFragment();
  chat.messages.forEach(m=>frag.appendChild(messageEl(m)));
  box.appendChild(frag); requestAnimationFrame(()=>{$("content").scrollTop=$("content").scrollHeight})
}
function messageEl(m){
  const row=document.createElement("div");row.className="message "+m.role;
  if(m.role==="assistant"){const av=document.createElement("div");av.className="mini";av.textContent="🐝";row.appendChild(av)}
  const b=document.createElement("div");b.className="bubble"; b.innerHTML=renderMarkdown(m.content);row.appendChild(b);return row
}
function renderMarkdown(t){
  const safe=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return safe.replace(/```(\w*)\n?([\s\S]*?)```/g,(a,lang,code)=>`<div class="codehead"><span>${lang||"code"}</span><button class="copy" onclick="copyText(this)">Copy</button></div><pre>${code.trim()}</pre>`).replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
}
function copyText(btn){const pre=btn.parentElement.nextElementSibling;navigator.clipboard?.writeText(pre.innerText);btn.textContent="Copied";setTimeout(()=>btn.textContent="Copy",900)}
function ensureChat(text){
  if(!state.current){const c={id:newId(),title:text.slice(0,42),messages:[]};state.chats.push(c);state.current=c.id}
  return currentChat()
}
function addLocal(role,content){const c=currentChat();c.messages.push({role,content});save();renderMessages();renderChats()}
async function send(){
  const input=$("input"), text=input.value.trim();if(!text)return;
  const c=ensureChat(text);c.messages.push({role:"user",content:text});input.value="";save();renderMessages();renderChats();
  const row=document.createElement("div");row.className="message assistant typing";row.innerHTML='<div class="mini">🐝</div><div class="bubble dots"><span>●</span> <span>●</span> <span>●</span></div>'; $("messages").appendChild(row);$("content").scrollTop=$("content").scrollHeight;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:c.messages})});
    const data=await r.json();
    row.remove();
    if(!r.ok) throw new Error(data.error||"Request failed");
    addLocal("assistant",data.reply);
  }catch(e){
    row.remove(); addLocal("assistant","⚠️ "+e.message);
  }
}
function ask(t){$("input").value=t;send()}
function loadChat(id){state.current=id;save();renderChats();renderMessages()}
function newChat(){state.current=null;renderChats();renderMessages();$("input").focus()}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==="light"?"":"light";if(document.documentElement.dataset.theme==="light"){document.body.style.background="#f4f4f4";document.body.style.color="#111"}else{document.body.style.background="var(--bg)";document.body.style.color="var(--text)"}}
function toggleSidebar(){document.querySelector(".sidebar").style.display=getComputedStyle(document.querySelector(".sidebar")).display==="none"?"flex":"none"}
function quickIdeas(){ask("Give me 10 useful and creative ideas I can try today.")}
function chatText(){const c=currentChat();return c?c.messages.map(m=>(m.role==="user"?"You":"Bee AI")+": "+m.content).join("\n\n"):""}
function copyChat(){const t=chatText();if(!t)return alert("Chat is empty.");navigator.clipboard?.writeText(t);alert("Chat copied!")}
function exportChat(){const t=chatText();if(!t)return alert("Chat is empty.");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="bee-ai-chat.txt";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});

let board=[],over=false;
function openGame(){$("gameModal").classList.add("show");resetGame()}
function closeGame(){$("gameModal").classList.remove("show")}
function resetGame(){board=Array(9).fill("");over=false;$("gameStatus").textContent="Your turn — you are X.";drawBoard()}
function drawBoard(){const b=$("board");b.replaceChildren();board.forEach((v,i)=>{const c=document.createElement("button");c.className="cell";c.textContent=v;c.onclick=()=>move(i);b.appendChild(c)})}
function winner(p){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(i=>board[i]===p))}
function move(i){if(over||board[i])return;board[i]="X";drawBoard();if(winner("X"))return end("You win! 🐝");if(board.every(Boolean))return end("Draw!");setTimeout(aiMove,180)}
function aiMove(){if(over)return;const free=board.map((v,i)=>v?null:i).filter(i=>i!==null);const i=free[Math.floor(Math.random()*free.length)];board[i]="O";drawBoard();if(winner("O"))end("Bee AI wins!");else if(board.every(Boolean))end("Draw!")}
function end(t){over=true;$("gameStatus").textContent=t}
renderChats();renderMessages();
</script>
</body>
</html>
